# Port-80 front for agent-lb. Transparent to LLM API traffic: SSE and
# WebSockets, unbuffered both ways, long timeouts, no retries, no caching.
# Runs in the tailscale network namespace; agent-lb listens on 127.0.0.1:2455.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    server_tokens off;
    # Default "combined" format: never logs Authorization, cookies or bodies.
    access_log /dev/stdout;

    tcp_nodelay on;
    gzip off;

    # Large prompts, images and files; long turns and idle streams
    # (agent-lb budgets are 7200 s, stream idle timeout 600 s).
    client_max_body_size 0;
    client_body_timeout 7500s;
    client_header_timeout 60s;
    send_timeout 7500s;
    keepalive_timeout 7500s;
    large_client_header_buffers 8 64k;

    # WebSocket upgrade; an empty Connection header keeps upstream keepalive.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream agent_lb {
        server 127.0.0.1:2455;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Internal operational routes (/internal/drain/*, /internal/oauth/pending,
        # /internal/bridge/responses) are gated on the socket peer being loopback.
        # Behind this proxy every :80 request has a loopback peer, so the gate
        # would pass for any tailnet client. Refuse them here; host tooling talks
        # to 127.0.0.1:2455 directly.
        location /internal/ {
            return 403;
        }

        location / {
            proxy_pass http://agent_lb;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Keep the client's Host; overwrite (never append) the forwarded
            # client address so a client cannot spoof it.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_redirect off;

            # Stream both directions; nothing spooled, cached or replayed.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_max_temp_file_size 0;
            proxy_next_upstream off;

            proxy_connect_timeout 10s;
            proxy_read_timeout 7500s;
            proxy_send_timeout 7500s;
        }
    }
}
